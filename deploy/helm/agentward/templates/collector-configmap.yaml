apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentward.collector.fullname" . }}
  labels:
    {{- include "agentward.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    {{- if .Values.collector.configOverride }}
    {{- .Values.collector.configOverride | nindent 4 }}
    {{- else }}
    {{- include "agentward.collector.config" . | nindent 4 }}
    {{- end }}
  pii_egress.rego: |
    {{- include "agentward.policy" . | nindent 4 }}
