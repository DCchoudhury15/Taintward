# A single Redis pod for trying several gateway replicas with a shared
# session store. No password and no persistence: for local tests only. In
# production use a managed Redis and put its URL (with password) in the Secret.
#
#   kubectl -n agentward apply -f deploy/helm/agentward/examples/redis.yaml
#   ... --set gateway.sessionStore.redisUrl=redis://redis:6379/0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
