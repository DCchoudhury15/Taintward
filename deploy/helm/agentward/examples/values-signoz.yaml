# Values for sending to a SigNoz installed with the official SigNoz Helm
# chart in the "platform" namespace (its default). Change the endpoint if
# your SigNoz lives elsewhere.
exporter:
  protocol: grpc
  endpoint: signoz-otel-collector.platform.svc.cluster.local:4317
  insecure: true

