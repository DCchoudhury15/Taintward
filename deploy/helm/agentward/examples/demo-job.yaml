# Runs the HR bot breach simulator once against the collector of a release
# named "agentward". It leaks a fake SSN and a fake AWS key on purpose.
#
#   docker compose build demo        # builds agentward-demo:local
#   kind load docker-image agentward-demo:local --name <cluster>
#   kubectl -n agentward apply -f deploy/helm/agentward/examples/demo-job.yaml
#   kubectl -n agentward logs job/agentward-demo
apiVersion: batch/v1
kind: Job
metadata:
  name: agentward-demo
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: demo
          image: agentward-demo:local
          imagePullPolicy: Never
          env:
            - name: COLLECTOR_ENDPOINT
              value: http://agentward-collector:4319/v1/traces
            # Demo only: a fixed public key so tokens are stable. Never in production.
            - name: AGENTWARD_ALLOW_DEMO_KEY
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
