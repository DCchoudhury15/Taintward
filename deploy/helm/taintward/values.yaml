# Taintward Helm chart values.
# Install guide: docs/deploy-kubernetes.md. Sizing: docs/scaling.md.

nameOverride: ""
fullnameOverride: ""

# Where the policy collector sends the checked (and redacted) spans.
# Any OTLP backend works: SigNoz, Jaeger, Tempo, another collector.
exporter:
  # grpc: endpoint is host:port (OTLP/gRPC, usually 4317).
  # http: endpoint is a base URL, for example http://otel-backend:4318
  #       (the exporter adds /v1/traces).
  protocol: grpc
  endpoint: signoz-otel-collector.platform.svc.cluster.local:4317
  # Plain text by default, which is normal inside a cluster. Set to false for TLS.
  insecure: true
  # Extra headers, for example a SigNoz Cloud ingestion key. Values may use
  # ${env:NAME} to read an env var set through collector.extraEnv
  # (put the key itself in a Secret, not here).
  headers: {}
  #   signoz-ingestion-key: ${env:SIGNOZ_INGESTION_KEY}

# ---------------------------------------------------------------------------
# Policy collector tier: OTLP receiver -> memory_limiter -> taint_policy -> batch -> exporter
# ---------------------------------------------------------------------------
collector:
  image:
    # Public image built by the release workflow.
    repository: ghcr.io/dcchoudhury15/taintward/collector
    # Empty means the chart's appVersion (the Taintward release).
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Used when autoscaling is off.
  replicas: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    # Scale out when average CPU use goes over this percent of the CPU request.
    targetCPUUtilizationPercentage: 70

  # Measured (docs/scaling.md): one core checks about 4k spans/s when every
  # span is a violation that needs redaction, about 17k spans/s for clean
  # spans. Requests are what the HPA percent is measured against.
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 512Mi

  # memory_limiter percents of the container memory limit. Above the soft
  # limit (limit - spike) the collector refuses new data with a retryable
  # error, so the SDK backs off instead of the pod being OOM killed.
  memoryLimiter:
    limitPercentage: 80
    spikeLimitPercentage: 20

  batch:
    timeout: 1s
    sendBatchSize: 512
    sendBatchMaxSize: 2048

  # The Rego policy. Empty means the policy shipped with the chart
  # (files/pii_egress.rego, a copy of collector/policy/pii_egress.rego).
  # Changing it rolls the pods (checksum annotation).
  policy:
    rego: ""

  # Optional extra exporter that writes OTLP JSON lines (one object per line).
  fileExport:
    enabled: false
    path: /var/lib/taintward/spans.jsonl
    maxMegabytes: 100
    maxBackups: 5
    # Leave empty for an emptyDir (lost when the pod goes). Set to a PVC name to keep it.
    existingClaim: ""

  # Also log a one line summary per batch (debug exporter). Noisy at high volume.
  debugExporter: false

  # Full collector config override, as YAML text. When set, the generated
  # config above is not used (the policy is still mounted at
  # /etc/taintward/policy/pii_egress.rego).
  configOverride: ""

  service:
    type: ClusterIP
    annotations: {}

  pdb:
    enabled: true
    minAvailable: 1

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread replicas over nodes when possible.
  topologySpread: true

  # Producer auth (gap G7). Every span sender needs
  # "Authorization: Bearer <token>"; for the Python SDK set
  # OTEL_EXPORTER_OTLP_HEADERS=Authorization=Bearer%20<token>. The token is
  # read from a Secret you create; the routing tier and the gateway in this
  # chart send it too.
  auth:
    enabled: false
    existingSecret: ""
    secretKey: token
  # service.name values whose spans are trusted (gap G7). Empty trusts every
  # producer. Spans from other services are treated as sensitive and their
  # taintward.args_redacted marker is ignored. Use it with auth above.
  trustedServices: []

  extraEnv: []
  #  - name: SIGNOZ_INGESTION_KEY
  #    valueFrom:
  #      secretKeyRef: {name: signoz, key: ingestion-key}

# ---------------------------------------------------------------------------
# Optional agent side tier: receives from agents and load balances by traceID
# to the policy tier, so every span of one agent run reaches the same policy
# pod. Only needed when the policy tier has more than one pod AND something
# needs whole traces in one place. Uses collector/config.gateway-tier.yaml logic.
# ---------------------------------------------------------------------------
routingTier:
  enabled: false
  # Deployment, or DaemonSet for one per node (agents send to the node local pod).
  kind: Deployment
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
  queueSize: 5000
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# Optional MCP gateway, serving MCP over HTTP on port 8811.
# ---------------------------------------------------------------------------
gateway:
  enabled: false
  image:
    repository: ghcr.io/dcchoudhury15/taintward/gateway
    # Empty means the chart's appVersion (the Taintward release).
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  # Presidio and spaCy are loaded in each process: about 300 MB per pod.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

  port: 8811
  logLevel: WARNING

  # Name of an existing Secret with the keys below. Required when the
  # gateway is enabled. Create it yourself, for example:
  #   kubectl create secret generic taintward-keys \
  #     --from-literal=TAINTWARD_FPE_KEY=$(openssl rand -hex 32) ...
  # Keys are never set in values.
  existingSecret: ""
  # Secret key name for each env var. A key missing from the Secret is skipped.
  secretKeys:
    TAINTWARD_FPE_KEY: TAINTWARD_FPE_KEY
    TAINTWARD_VAULT_KEY: TAINTWARD_VAULT_KEY
    TAINTWARD_GATEWAY_TOKEN: TAINTWARD_GATEWAY_TOKEN

  # Shared session store, so any replica can serve any MCP session (the
  # session taint lives there). Without it each replica keeps its own
  # sessions in memory, so run one replica or turn on sessionAffinity.
  # Set as TAINTWARD_SESSION_STORE.
  sessionStore:
    # Plain URL without a password, for example redis://redis:6379/0.
    redisUrl: ""
    # Or: key in existingSecret that holds the URL (for URLs with a password).
    redisUrlSecretKey: ""

  # Token vault for reversible tokens (TAINTWARD_VAULT). Empty means memory,
  # which is per pod. Use redis://... or postgresql://... with several
  # replicas, and put TAINTWARD_VAULT_KEY in the Secret.
  vault:
    url: ""
    # Or: key in existingSecret that holds the URL.
    urlSecretKey: ""

  # Where the gateway sends its spans (OTLP/HTTP). Empty means the policy
  # collector Service of this release.
  otlpEndpoint: ""

  # Gateway config (gateway.yaml), see docs/mcp-gateway.md. The default is
  # the example HR server that ships in the image, so the chart starts on
  # its own. Replace `upstreams` and `tools` with your own before real use.
  config:
    service_name: taintward-mcp-gateway
    upstreams:
      - name: hr
        command: python
        args: ["-m", "taintward.gateway.examples.hr_server"]
        cwd: /app
        env:
          TAINTWARD_HR_OUTBOX: /tmp/taintward-hr-outbox.jsonl
    defaults:
      destination: external
      jurisdiction: ""
      mode: redact
      redact_results: true
    tools:
      - match: "get_*"
        destination: internal
      - match: "send_email"
        destination: external
        jurisdiction: us
        mode: block

  service:
    type: ClusterIP
    # ClientIP keeps one client on one pod. Only needed without a shared session store.
    sessionAffinity: None
    annotations: {}

  pdb:
    enabled: true
    minAvailable: 1

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Scheduled key rotation: a CronJob that runs
#   python -m taintward.keys_cli rotate --keys <keys> --purpose <p> --if-older-than <maxAgeDays> [--reseal]
# for each purpose. It only rotates when the active key is older than
# maxAgeDays, so a daily schedule is safe. The ring must be one the job can
# write: HashiCorp Vault KV (vault-kv:<mount>/<path>), written with
# check-and-set. Running pods pick up the new vault key when they set
# TAINTWARD_KEYS_RELOAD_SECONDS (put it in their Secret or extraEnv).
# See docs/key-management.md.
keyRotation:
  enabled: false
  schedule: "17 3 * * *"
  maxAgeDays: 90
  # vault: the key that seals originals at rest. fpe changes every new token,
  # so rotate it on purpose, not on a timer.
  purposes: [vault]
  # The ring, for example vault-kv:secret/taintward. Required when enabled.
  keys: ""
  # Wrap new keys with this KMS (empty: the ring's top-level "kms"). The
  # gateway image has no AWS or Google client libraries: use vault-transit,
  # or an image with taintward[aws] / taintward[gcp].
  kms: ""
  # Re-encrypt vault rows right after a vault rotation (needs TAINTWARD_VAULT
  # in the Secret).
  reseal: true
  # Name of an existing Secret with VAULT_ADDR, VAULT_TOKEN, TAINTWARD_VAULT,
  # TAINTWARD_KEYS_KMS_ONLY ... passed as environment variables. Required.
  existingSecret: ""
  image:
    # Empty: the gateway image (it has the taintward-keys command).
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Control plane for many tenants (taintward-control): tool policy per
# tenant, span upload, reports, audits and evidence. See docs/control-plane.md.
# One replica with a persistent volume (it keeps its data in files).
controlPlane:
  enabled: false
  image:
    # Empty: the gateway image (it has taintward and PyYAML).
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  port: 8820
  # Tenants and the SHA-256 of their tokens (taintward-control new-token).
  # Rendered into a Secret as control.yaml with data_dir /data. Only hashes
  # go here, never tokens.
  #   tenants:
  #     acme:
  #       home: [eu]
  #       tokens:
  #         - {name: support-bot, role: agent, sha256: 5e1c...}
  tenants: {}
  maxBodyBytes: 8388608
  # Or: an existing Secret with the whole config under the key control.yaml
  # (its data_dir must be /data). Overrides tenants above.
  existingSecret: ""
  # A kubernetes.io/tls Secret: serve HTTPS in the pod. Without it, put TLS
  # in front (Ingress or service mesh).
  tlsSecret: ""
  persistence:
    size: 10Gi
    storageClass: ""
    # Use this PVC instead of creating one.
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  service:
    type: ClusterIP
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
