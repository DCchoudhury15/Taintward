# Values for trying the chart on a local cluster (kind, minikube) with the
# Jaeger from examples/jaeger.yaml as the backend.
exporter:
  protocol: grpc
  endpoint: jaeger:4317

collector:
  image:
    # Built locally and loaded with `kind load docker-image`.
    repository: taintward-collector
    tag: local
    pullPolicy: Never
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 256Mi
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
