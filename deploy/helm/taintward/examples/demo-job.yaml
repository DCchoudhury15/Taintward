# Runs the HR bot breach simulator once against the collector of a release
# named "taintward". It leaks a fake SSN and a fake AWS key on purpose.
#
#   docker compose build demo        # builds taintward-demo:local
#   kind load docker-image taintward-demo:local --name <cluster>
#   kubectl -n taintward apply -f deploy/helm/taintward/examples/demo-job.yaml
#   kubectl -n taintward logs job/taintward-demo
apiVersion: batch/v1
kind: Job
metadata:
  name: taintward-demo
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: demo
          image: taintward-demo:local
          imagePullPolicy: Never
          env:
            - name: COLLECTOR_ENDPOINT
              value: http://taintward-collector:4319/v1/traces
            # Demo only: a fixed public key so tokens are stable. Never in production.
            - name: TAINTWARD_ALLOW_DEMO_KEY
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
