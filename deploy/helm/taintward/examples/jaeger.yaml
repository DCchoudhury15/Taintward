# A single Jaeger pod (in memory storage) to use as the trace backend while
# trying the chart. Not for production: traces are lost on restart.
#
#   kubectl create namespace taintward
#   kubectl -n taintward apply -f deploy/helm/taintward/examples/jaeger.yaml
#   helm install taintward deploy/helm/taintward -n taintward \
#     -f deploy/helm/taintward/examples/values-jaeger.yaml
#   kubectl -n taintward port-forward svc/jaeger 26686:16686   # UI at http://localhost:26686
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.21.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 4317
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
