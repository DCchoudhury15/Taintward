apiVersion: v1
kind: Service
metadata:
  name: {{ include "taintward.collector.fullname" . }}
  labels:
    {{- include "taintward.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  {{- with .Values.collector.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.collector.service.type }}
  selector:
    {{- include "taintward.selectorLabels" (dict "ctx" . "component" "collector") | nindent 4 }}
  ports:
    - name: otlp-http
      port: 4319
      targetPort: otlp-http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
# Headless Service: its DNS name resolves to every ready collector pod. The
# routing tier's load_balancing exporter uses it to send by traceID.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taintward.collector.fullname" . }}-headless
  labels:
    {{- include "taintward.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  clusterIP: None
  selector:
    {{- include "taintward.selectorLabels" (dict "ctx" . "component" "collector") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
