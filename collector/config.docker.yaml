# Taintward collector config for the Docker image.
#
# Flow:  SDK --OTLP/HTTP :4319 or OTLP/gRPC :4317--> [memory_limiter] -> [taint_policy] -> [batch]
#        --OTLP/gRPC--> ${OTLP_EXPORT_ENDPOINT}
#
# Environment variables:
#   OTLP_EXPORT_ENDPOINT        any OTLP gRPC backend as host:port, for example
#                               jaeger:4317 (the quickstart default) or a SigNoz
#                               collector at <host>:4317.
#   TAINTWARD_TRACE_EXPORTERS   exporters used by the traces pipeline, as a YAML
#                               list. Default: [otlp_grpc/backend, debug].
#                               Add file to also write OTLP JSON lines:
#                               [otlp_grpc/backend, file]
#   TAINTWARD_FILE_EXPORT_PATH  where the file exporter writes. Default:
#                               /var/lib/taintward/spans.jsonl (mount a volume there).
#   TAINTWARD_MEMORY_LIMIT_MIB  memory_limiter hard limit. Default 400.
#                               Keep it about 80% of the container memory limit.
receivers:
  # 0.0.0.0 inside the container; publish the ports on 127.0.0.1 or a
  # private network only. There is no producer auth here: use
  # config.secure.yaml (or Helm collector.auth) when other hosts send spans.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
      grpc:
        endpoint: 0.0.0.0:4317

extensions:
  # GET http://<pod>:13133/ returns 200 when the collector is up.
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  # First in the pipeline: refuses data (the SDK retries) instead of being OOM killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:TAINTWARD_MEMORY_LIMIT_MIB:-400}
    spike_limit_mib: 80
  taint_policy:
    # Baked into the image. Mount your own file over this path and restart
    # the container to change the policy. No rebuild needed.
    policy_path: /etc/taintward/policy/pii_egress.rego
  # taint_policy runs BEFORE batch (batching clears request context).
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_grpc/backend:
    endpoint: ${env:OTLP_EXPORT_ENDPOINT}
    tls:
      insecure: true
  # Only used when listed in TAINTWARD_TRACE_EXPORTERS. One OTLP JSON object per line.
  file:
    path: ${env:TAINTWARD_FILE_EXPORT_PATH:-/var/lib/taintward/spans.jsonl}
    format: json
    create_directory: true
    rotation:
      max_megabytes: 100
      max_backups: 5
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, taint_policy, batch]
      exporters: ${env:TAINTWARD_TRACE_EXPORTERS:-[otlp_grpc/backend, debug]}
