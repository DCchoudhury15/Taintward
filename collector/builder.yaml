dist:
  name: taintward-collector
  module: github.com/DCchoudhury15/taintward/collector
  go: "1.26"
  output_path: ./build
  description: Taintward collector, OTLP receiver + taint_policy (Rego) processor + OTLP, load balancing and file exporters.

# Component versions aligned with the collector core the builder ships (v0.160.0).
# Contrib components use the same release number (opentelemetry-collector-contrib v0.160.0).
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0
  # Drops data and refuses new data when the heap gets close to the limit,
  # instead of the pod being OOM killed.
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.160.0
  # Custom processor, local module, pulled in via the replace below.
  - gomod: github.com/DCchoudhury15/taintward/collector/processor/taintpolicy v0.0.0
    import: github.com/DCchoudhury15/taintward/collector/processor/taintpolicy

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.160.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.160.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.160.0
  # Two tier layout: routes every span of one trace to the same policy tier pod.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/loadbalancingexporter v0.160.0
  # OTLP JSON lines on disk, for offline reports.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.160.0

extensions:
  # HTTP health endpoint (default :13133) for Kubernetes probes.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.160.0
  # Producer auth on the OTLP receiver, and the token on exports to the
  # policy tier (config.secure.yaml, Helm collector.auth).
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.160.0

replaces:
  - github.com/DCchoudhury15/taintward/collector/processor/taintpolicy => /home/divyanshu/taintward/collector/processor/taintpolicy
