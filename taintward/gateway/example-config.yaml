# Taintward MCP gateway example config.
# Run:  python -m taintward.gateway --config taintward/gateway/example-config.yaml
# Reference: docs/mcp-gateway.md

service_name: taintward-mcp-gateway

# Where session taint is kept. memory is fine for stdio and for one HTTP
# replica. Several replicas behind a load balancer need a shared Redis.
# TAINTWARD_SESSION_STORE overrides this.
session_store: memory       # or redis://redis:6379/0
session_ttl: 86400          # seconds a session is kept after its last use

# Serve over HTTP instead of stdio:
#   python -m taintward.gateway --config taintward/gateway/example-config.yaml --listen 0.0.0.0:8811
# Set TAINTWARD_GATEWAY_TOKEN to require "Authorization: Bearer <token>", or
# TAINTWARD_GATEWAY_TOKENS=support-bot:<token>,... for one token per client,
# so a client's taint survives a new session.

# A tool whose description or schema changes after the gateway first saw it
# (or differs from its pin below) is reported; "hide" also stops exposing it.
on_tool_change: warn        # or hide
# Pins from: python -m taintward.gateway --config <this file> --print-tool-pins
# tool_pins:
#   get_employee: "sha256:..."

# Upstream MCP servers. Each one is either a local command (stdio) or a
# streamable HTTP url. Their tools are re-exposed with the same names and
# schemas. "python" means the interpreter running the gateway. A relative
# cwd is relative to this file.
upstreams:
  - name: hr
    command: python
    args: ["-m", "taintward.gateway.examples.hr_server"]
    cwd: ../..
    env:
      TAINTWARD_HR_OUTBOX: /tmp/taintward-hr-outbox.jsonl
    # prefix: "hr_"      # optional: exposes get_employee as hr_get_employee
  # - name: docs
  #   url: http://localhost:8000/mcp

# Used for any tool no rule below matches. external is the safe default: an
# unknown tool is treated as a place data can leave through.
defaults:
  destination: external     # internal | external | llm | log | rag
  jurisdiction: ""          # e.g. "us" or "eu" (GDPR Art. 44 transfer rule)
  mode: redact              # redact | block | audit
  redact_results: true      # mask sensitive values in results before the agent sees them

# Rules are checked top to bottom and the first match wins. match is a glob
# on the exposed tool name (* ? [abc]). upstream: limits a rule to one upstream.
tools:
  - match: "get_*"
    destination: internal
  - match: "list_*"
    destination: internal
  - match: "send_email"
    destination: external
    jurisdiction: us
    mode: block
  - match: "log_*"
    destination: log
    mode: audit
