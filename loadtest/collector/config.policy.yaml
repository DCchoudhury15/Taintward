# Load test config: the real policy pipeline (memory_limiter -> taint_policy -> batch).
# The exporter is debug at basic verbosity: one short log line per batch, so
# the measurement is the collector's own work, not a backend.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 800
    spike_limit_mib: 160
  taint_policy:
    policy_path: /etc/agentward/policy/pii_egress.rego
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, taint_policy, batch]
      exporters: [debug]
