# Taintward quickstart: `docker compose up`
#
#   demo (HR bot) --OTLP/HTTP--> taintward-collector (taint_policy) --OTLP/gRPC--> jaeger
#
# Open the Jaeger UI at http://localhost:16686 and pick service taintward-hr-bot.
#
# To send traces to an existing SigNoz (or any OTLP gRPC backend) instead of
# Jaeger, set OTLP_EXPORT_ENDPOINT and start without Jaeger:
#
#   OTLP_EXPORT_ENDPOINT=host.docker.internal:4317 docker compose up --no-deps taintward-collector demo
#
# See docs/quickstart.md for details.
#
# Host ports: 16686 (Jaeger UI) and 14319 (collector OTLP/HTTP, for your own
# agents). 4317, 4318 and 8080 are left free so a local SigNoz keeps working.
#
# To also write every checked span as OTLP JSON lines into the
# taintward-spans volume (file /var/lib/taintward/spans.jsonl):
#
#   TAINTWARD_TRACE_EXPORTERS='[otlp_grpc/backend, file]' docker compose up

name: taintward

services:
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"
    restart: unless-stopped

  taintward-collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: taintward-collector:local
    environment:
      OTLP_EXPORT_ENDPOINT: ${OTLP_EXPORT_ENDPOINT:-jaeger:4317}
      TAINTWARD_TRACE_EXPORTERS: ${TAINTWARD_TRACE_EXPORTERS:-[otlp_grpc/backend, debug]}
    # Lets OTLP_EXPORT_ENDPOINT=host.docker.internal:4317 reach a backend on the host (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Edit collector/policy/pii_egress.rego and restart this service to change the policy.
      - ./collector/policy:/etc/taintward/policy:ro
      # Used only when TAINTWARD_TRACE_EXPORTERS lists file.
      - taintward-spans:/var/lib/taintward
    ports:
      - "14319:4319"
    depends_on:
      - jaeger
    restart: unless-stopped

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    image: taintward-demo:local
    environment:
      COLLECTOR_ENDPOINT: http://taintward-collector:4319/v1/traces
      # Demo only: a fixed public key so tokens are stable between runs. Set
      # TAINTWARD_FPE_KEY to your own key for anything real.
      TAINTWARD_ALLOW_DEMO_KEY: "1"
    depends_on:
      - taintward-collector
    restart: "no"

volumes:
  taintward-spans:
