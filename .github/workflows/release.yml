name: release

# Pushing a tag vX.Y.Z publishes taintward to PyPI and makes a GitHub
# release. PyPI upload uses trusted publishing (OIDC), so no token is
# stored here. One-time setup and the steps: docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match taintward.__version__
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(python -c "import ast; t=ast.parse(open('taintward/__init__.py').read()); print([n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'][0])")
          if [ "$VERSION" != "$CODE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match taintward.__version__ $CODE_VERSION"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
      # PyPI shows the README on its own: make links and images absolute.
      - run: python scripts/pypi_readme.py "$GITHUB_REF_NAME"
      - run: python -m pip install -c constraints.txt build twine
      - run: python -m build -o dist .
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            release-notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/taintward/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Taintward ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
