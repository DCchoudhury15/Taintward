name: ci

# Mirror of the test jobs in .gitlab-ci.yml (GitLab is the main CI and does
# releases). Runs on pull requests and on main only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[dev,llm,langchain]" build twine
      - run: python -m spacy download en_core_web_sm
      - run: python -m spacy download xx_ent_wiki_sm
      - run: python -m pytest -q
      - run: python -m build -o dist .
      - run: python -m twine check --strict dist/*

  adapter-tests:
    # CrewAI, LlamaIndex, Pydantic AI, Google ADK and LiteLLM, against the
    # real frameworks; their pins clash with constraints.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-adapters.txt
      - run: python -m pip install -c constraints-adapters.txt -e ".[dev,crewai,llamaindex,pydantic-ai,google-adk,litellm]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q tests/test_integrations_frameworks.py tests/test_integrations.py tests/test_placeholders.py tests/test_link_restore.py tests/test_stream_restore.py

  detection-bench:
    # Detection quality on two public labeled PII datasets (bench/external).
    # Fails when a score drops under its floor (FLOORS in run_external.py).
    # The datasets (about 150 MB) are pinned to a dataset commit and cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: python -m pip install -c constraints.txt -e ".[dev]" pyarrow==26.0.0
      - run: python -m spacy download en_core_web_sm
      - run: python -m spacy download xx_ent_wiki_sm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/taintward-bench/external
          key: bench-external-${{ hashFiles('bench/external/download.py') }}
      - run: python bench/external/download.py
      - run: python bench/external/run_external.py --check --wrapped 0 --out-dir "$RUNNER_TEMP/bench"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt ruff
      - run: ruff check . --statistics || true
      - run: ruff check .

  ts-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/taintward-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/taintward-js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector/processor/taintpolicy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/processor/taintpolicy/go.mod
          cache-dependency-path: collector/processor/taintpolicy/go.sum
      - run: go vet ./...
      - run: go test ./...

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.20.2
      - run: diff collector/policy/pii_egress.rego deploy/helm/taintward/files/pii_egress.rego
      - run: helm lint deploy/helm/taintward
      - run: helm template t deploy/helm/taintward > /dev/null
      - run: >-
          helm template t deploy/helm/taintward
          --set gateway.enabled=true --set gateway.existingSecret=keys
          --set routingTier.enabled=true --set collector.fileExport.enabled=true > /dev/null
