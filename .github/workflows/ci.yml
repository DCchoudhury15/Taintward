name: ci

# Same jobs as .gitlab-ci.yml except collector-image (the Docker build check).
# Runs on pull requests and on main only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps -w dist

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check . --statistics || true
      - run: ruff check .

  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector/processor/taintpolicy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/processor/taintpolicy/go.mod
          cache-dependency-path: collector/processor/taintpolicy/go.sum
      - run: go vet ./...
      - run: go test ./...

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: diff collector/policy/pii_egress.rego deploy/helm/agentward/files/pii_egress.rego
      - run: helm lint deploy/helm/agentward
      - run: helm template t deploy/helm/agentward > /dev/null
      - run: >-
          helm template t deploy/helm/agentward
          --set gateway.enabled=true --set gateway.existingSecret=keys
          --set routingTier.enabled=true --set collector.fileExport.enabled=true > /dev/null
