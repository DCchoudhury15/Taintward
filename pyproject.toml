[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentward"
version = "0.2.0"
description = "Runtime enforcement of the AgentRaft Data Over-Exposure model on OpenTelemetry + SigNoz"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Divyanshu Choudhury" }]

# core/doe.py is pure stdlib; everything below is what sdk/, evidence/, and
# fix_suggester/ actually import at runtime (Phase 2+). Presidio also needs
# the spaCy model, which isn't a normal PyPI dependency: run
# `python3 -m spacy download en_core_web_sm` once after installing.
dependencies = [
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    "cryptography>=42",
    "requests>=2.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Only needed for `--llm real` (the default demo/tests use the stub LLM).
llm = ["openai", "anthropic"]
# MCP gateway (gateway/).
mcp = ["mcp>=2.3", "PyYAML>=6"]
# Framework adapters (sdk/integrations/).
langchain = ["langchain-core>=1.7", "langchain>=1.4", "langgraph>=1.2"]
openai-agents = ["openai-agents>=0.24"]

[project.scripts]
agentward-evidence = "evidence.log:main"
agentward-fix = "fix_suggester.suggest:main"
agentward-gateway = "gateway.__main__:main"

# Runtime packages only. tests/, demo/, spike/, scripts/ and the Go collector
# are not shipped. New runtime packages (e.g. integrations, gateway) go in
# the include list below; their extra deps go in [project.optional-dependencies].
[tool.setuptools.packages.find]
include = ["sdk", "sdk.*", "core", "core.*", "evidence", "evidence.*", "fix_suggester", "fix_suggester.*", "gateway", "gateway.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pinned rule set so lint results do not drift with ruff's defaults.
[tool.ruff]
target-version = "py311"
extend-exclude = [".cache", "site", "signoz", "collector"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
