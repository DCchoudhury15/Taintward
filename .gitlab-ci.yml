# Runs on merge requests and on main only, to keep the pipeline count low.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

.python:
  image: python:3.12
  cache:
    key:
      files: [pyproject.toml]
      prefix: pip
    paths: [.cache/pip]

python-tests:
  extends: .python
  stage: test
  script:
    - python -m pip install -e ".[dev]"
    - python -m spacy download en_core_web_sm
    - python -m pytest -q
    - python -m pip wheel . --no-deps -w dist

ruff:
  extends: .python
  stage: test
  script:
    - python -m pip install ruff
    - ruff check . --statistics || true
    - ruff check .

go-tests:
  image: golang:1.26
  stage: test
  cache:
    key:
      files: [collector/processor/taintpolicy/go.sum]
      prefix: go
    paths: [.cache/go, .cache/go-build]
  script:
    - cd collector/processor/taintpolicy
    - go vet ./...
    - go test ./...

# Lints the Helm chart, renders it with the gateway and routing tier on, and
# checks the chart's policy copy matches collector/policy/pii_egress.rego.
helm-lint:
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  stage: test
  script:
    - diff collector/policy/pii_egress.rego deploy/helm/taintward/files/pii_egress.rego
    - helm lint deploy/helm/taintward
    - helm template t deploy/helm/taintward > /dev/null
    - >-
      helm template t deploy/helm/taintward
      --set gateway.enabled=true --set gateway.existingSecret=keys
      --set routingTier.enabled=true --set collector.fileExport.enabled=true > /dev/null

# Builds the collector image (ocb compile included) to catch build breaks.
# Nothing is pushed.
collector-image:
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  stage: test
  script:
    - docker build -f collector/Dockerfile -t taintward-collector:ci .
    - docker image ls taintward-collector:ci
