# AgentWard MCP gateway example config.
# Run:  python -m gateway --config gateway/example-config.yaml
# Reference: docs/mcp-gateway.md

service_name: agentward-mcp-gateway

# Upstream MCP servers. Each one is either a local command (stdio) or a
# streamable HTTP url. Their tools are re-exposed with the same names and
# schemas. "python" means the interpreter running the gateway. A relative
# cwd is relative to this file.
upstreams:
  - name: hr
    command: python
    args: ["-m", "gateway.examples.hr_server"]
    cwd: ..
    env:
      AGENTWARD_HR_OUTBOX: /tmp/agentward-hr-outbox.jsonl
    # prefix: "hr_"      # optional: exposes get_employee as hr_get_employee
  # - name: docs
  #   url: http://localhost:8000/mcp

# Used for any tool no rule below matches. external is the safe default: an
# unknown tool is treated as a place data can leave through.
defaults:
  destination: external     # internal | external | llm | log | rag
  jurisdiction: ""          # e.g. "us" or "eu" (GDPR Art. 44 transfer rule)
  mode: redact              # redact | block | audit
  redact_results: true      # mask sensitive values in results before the agent sees them

# Rules are checked top to bottom and the first match wins. match is a glob
# on the exposed tool name (* ? [abc]). upstream: limits a rule to one upstream.
tools:
  - match: "get_*"
    destination: internal
  - match: "list_*"
    destination: internal
  - match: "send_email"
    destination: external
    jurisdiction: us
    mode: block
  - match: "log_*"
    destination: log
    mode: audit
